<section class="flow" id="flow">
    <div class="container">
        <h3 class="section-title">{{ flow.title }}</h3>
        <div class="flow-steps">
            {% for step in flow.steps %}
            <div class="flow-step">
                <div class="step-number">STEP {{ step.step }}</div>
                <div class="step-content">
                    <h4>{{ step.title }}</h4>
                    <p>{{ step.description }}</p>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
