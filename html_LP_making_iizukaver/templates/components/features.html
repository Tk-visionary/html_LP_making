<section class="features" id="features">
    <div class="container">
        <h3 class="section-title">選ばれる理由</h3>
        <div class="features-grid">
            {% for feature in features %}
            <div class="feature-item">
                <div class="feature-icon">{{ feature.icon }}</div>
                <h4>{{ feature.title }}</h4>
                <p>{{ feature.description }}</p>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
