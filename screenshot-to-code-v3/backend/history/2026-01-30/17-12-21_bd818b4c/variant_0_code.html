<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <title>Beauty Treatment</title>
  <style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: #ffffff;
    }
  </style>
</head>
<body class="bg-white text-[#333333] flex flex-col items-center min-h-screen">

  <main class="flex flex-col items-center text-center px-4 py-8 max-w-4xl mx-auto">
    <div class="mb-4 md:mb-6 lg:mb-8">
      <p class="text-[#e94e7d] font-bold text-3xl md:text-4xl lg:text-5xl leading-tight">化粧品・レーザーでは</p>
      <p class="text-[#333333] font-bold text-3xl md:text-4xl lg:text-5xl leading-tight">届かない<span class="text-[#e94e7d]">99%</span>へ。</p>
    </div>

    <div class="mb-8 md:mb-10 lg:mb-12">
      <p class="text-[#333333] text-lg md:text-xl lg:text-2xl leading-relaxed">肌は内側から作られる。</p>
      <p class="text-[#333333] text-lg md:text-xl lg:text-2xl leading-relaxed">だから、内側から届ける美肌治療。</p>
    </div>

    <div class="w-full max-w-md md:max-w-lg lg:max-w-xl mb-8 md:mb-10 lg:mb-12">
      <!-- Image region: top:299px, left:100px, width:800px, height:498px, type:human -->
      <img src="__SCREENSHOT_URL__" alt="Smiling woman in a lab coat holding medication" class="w-full h-auto object-contain">
    </div>

    <div class="flex flex-wrap justify-center gap-2 md:gap-4 mb-4">
      <span class="bg-[#50b0d8] text-white text-sm md:text-base font-bold px-4 py-2 rounded-full whitespace-nowrap">累計40万人利用</span>
      <span class="bg-[#50b0d8] text-white text-sm md:text-base font-bold px-4 py-2 rounded-full whitespace-nowrap">医薬品処方</span>
      <span class="bg-[#50b0d8] text-white text-sm md:text-base font-bold px-4 py-2 rounded-full whitespace-nowrap">6ヶ月で80%効果実感</span>
    </div>

    <div class="text-xs md:text-sm text-[#333333] text-center leading-relaxed">
      <p>※累計利用者数は2020年10月1日～2025年10月30日</p>
      <p>※効果実感率は2025年9月調査、利用者498名対象</p>
    </div>
  </main>

</body>
</html>
