<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #ffffff;
        }
        .text-dark-gray { color: #333333; }
        .text-pink-custom { color: #E9548D; }
        .bg-blue-custom { background-color: #50B0D8; }
        .text-light-gray { color: #666666; }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen">
    <div class="w-full max-w-screen-sm px-4 py-8 md:py-12 lg:py-16 text-center">
        <!-- Main Headline -->
        <h1 class="text-3xl md:text-4xl lg:text-5xl font-bold leading-tight mb-4 md:mb-6">
            <span class="text-dark-gray">化粧品・レーザーでは</span><br>
            <span class="text-dark-gray">届かない</span><span class="text-pink-custom">99%</span><span class="text-dark-gray">へ。</span>
        </h1>

        <!-- Sub-headline -->
        <p class="text-lg md:text-xl lg:text-2xl text-dark-gray font-bold mb-8 md:mb-12">
            肌は内側から作られる。<br>
            だから、内側から届ける美肌治療。
        </p>

        <!-- Image -->
        <div class="relative w-full max-w-md mx-auto mb-8 md:mb-12">
            /* Image region: top:392px, left:9px, width:737px, height:737px, type:human */
            <img src="__SCREENSHOT_URL__" alt="Woman in lab coat holding pills" class="w-full h-auto object-cover">
        </div>

        <!-- Badges Section -->
        <div class="flex flex-col sm:flex-row justify-center items-center gap-3 mb-6 md:mb-8">
            <div class="bg-blue-custom text-white text-base md:text-lg font-bold px-6 py-2 rounded-full whitespace-nowrap">
                累計40万人利用
            </div>
            <div class="bg-blue-custom text-white text-base md:text-lg font-bold px-6 py-2 rounded-full whitespace-nowrap">
                医薬品処方
            </div>
            <div class="bg-blue-custom text-white text-base md:text-lg font-bold px-6 py-2 rounded-full whitespace-nowrap">
                6ヶ月で80%効果実感
            </div>
        </div>

        <!-- Disclaimer Text -->
        <p class="text-sm md:text-base text-light-gray mb-1">
            ※累計利用者数は2020年10月1日〜2025年10月30日
        </p>
        <p class="text-sm md:text-base text-light-gray">
            ※効果実感率は2025年9月調査、利用者498名対象
        </p>
    </div>
</body>
</html>
